<style>
/* ===== ЖАРИНА tokens ===== */
:root{
  --ground:#151515;--surface-1:#20201e;--surface-2:#323232;--surface-3:#434343;--line:#3a3a38;
  --ink:#ecebe6;--ink-soft:#c9c8c4;--ink-muted:#a3a29c;
  --clay:#93c48b;--on-clay:#151515;--clay-dim:#3c5238;--clay-soft:#1f2b1e;
  --amber:#e0b24a;--amber-soft:#33291a;--ok:#93c48b;--danger:#f2878f;--danger-soft:#3a1f22;--info:#8fb3e0;--info-soft:#1c2633;
  --space-05:2px;--space-1:4px;--space-2:8px;--space-3:12px;--space-4:16px;--space-5:20px;--space-6:24px;--space-8:32px;--space-10:40px;
  --radius-2xs:4px;--radius-xs:8px;--radius-sm:12px;--radius-md:16px;--radius-lg:24px;--radius-full:9999px;
  --control-xs:24px;--control-sm:28px;--control-ms:32px;--control-md:36px;--control-lg:44px;--control-xl:52px;--control-2xl:60px;
  --icon-sm:16px;--icon:20px;--icon-lg:24px;
  --shadow-tray:inset 0 1px 0 #ffffff14,0 8px 24px #00000080;--shadow-btn:inset 0 1px 0 #ffffff12;
  --focus-ring:0 0 0 2px #151515,0 0 0 4px #93c48b;
  --serif:Literata,"Iowan Old Style",Georgia,serif;--sans:Onest,-apple-system,"Segoe UI",Roboto,sans-serif;
  --ease:cubic-bezier(.2,.8,.2,1);
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--ground);color:var(--ink);font:400 17px/24px var(--sans);
  -webkit-user-select:none;user-select:none;overscroll-behavior:none;touch-action:none}
button,input,select,textarea{font:inherit;color:inherit;margin:0}
button{border:0;background:none;padding:0;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:none;box-shadow:var(--focus-ring)}
input,textarea,select{-webkit-user-select:text;user-select:text}
.ico{width:var(--icon);height:var(--icon);stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.num{font-variant-numeric:tabular-nums}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}

/* ===== controls ===== */
.bc{width:var(--control-lg);height:var(--control-lg);border-radius:var(--radius-full);background:var(--surface-2);box-shadow:var(--shadow-btn);
  display:grid;place-items:center;color:var(--ink);transition:transform .15s var(--ease),background .15s}
.bc:active{transform:scale(.92)}
.bc.on{background:var(--clay-soft);color:var(--clay);box-shadow:inset 0 0 0 2px var(--clay)}
.bc.rec{background:var(--danger-soft);color:var(--danger);box-shadow:inset 0 0 0 2px var(--danger)}
.pill{height:var(--control-md);padding:0 var(--space-4);border-radius:var(--radius-full);background:var(--surface-3);display:inline-flex;align-items:center;gap:var(--space-2);font-weight:500;font-size:16px;white-space:nowrap}
.pill.primary{background:var(--clay);color:var(--on-clay)}
.pill.ghost{background:transparent;box-shadow:inset 0 0 0 1px var(--line)}
.pill.danger{background:var(--danger-soft);color:var(--danger)}
.pill.lg{height:var(--control-lg);padding:0 var(--space-5)}
.pill:active{transform:scale(.97)}
.pill[disabled]{opacity:.45;pointer-events:none}
.seg{display:inline-flex;background:var(--surface-1);border-radius:var(--radius-full);padding:var(--space-05);gap:var(--space-05)}
.seg button{height:var(--control-sm);padding:0 var(--space-3);border-radius:var(--radius-full);font-size:14px;font-weight:500;color:var(--ink-muted)}
.seg button.on{background:var(--surface-3);color:var(--ink)}
.seg.wide{display:flex}.seg.wide button{flex:1;height:var(--control-md)}
.chip{white-space:nowrap;flex:none;height:var(--control-ms);padding:0 var(--space-3);border-radius:var(--radius-full);background:var(--surface-1);box-shadow:inset 0 0 0 1.5px var(--line);font-size:14px;font-weight:500;display:inline-flex;align-items:center;gap:var(--space-1)}
.chip.on{background:var(--clay-soft);box-shadow:inset 0 0 0 1.5px var(--clay);color:var(--clay)}
.field{display:flex;flex-direction:column;gap:var(--space-1);margin-bottom:var(--space-3)}
.field>label,.ovl{font-size:12px;line-height:16px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-muted)}
.inp{height:var(--control-lg);border-radius:var(--radius-md);background:var(--surface-1);border:1px solid var(--line);padding:0 var(--space-3);font-size:17px;width:100%}
textarea.inp{height:80px;padding:var(--space-2) var(--space-3);resize:none}
.inp:focus{outline:none;border-color:var(--clay)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:var(--control-lg);background:transparent}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:var(--surface-3)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:var(--clay);margin-top:-10px;box-shadow:0 0 0 4px var(--ground)}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--surface-3)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:var(--clay);border:0}
.stepper{display:inline-flex;align-items:center;gap:var(--space-2)}
.stepper .bc{width:var(--control-md);height:var(--control-md)}
.stepper b{min-width:36px;text-align:center;font-weight:500}
.row{display:flex;align-items:center;gap:var(--space-2)}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--ink-muted)}.cap{font-size:13px;line-height:18px}
.hr{height:1px;background:var(--line);margin:var(--space-3) 0}

/* ===== HUD ===== */
#top{position:fixed;left:0;right:0;top:0;padding:calc(var(--sat) + var(--space-2)) var(--space-2) 0;display:flex;gap:var(--space-2);align-items:flex-start;pointer-events:none;z-index:5}
#top>*{pointer-events:auto}
#status{flex:1;min-width:0;min-height:var(--control-lg);border-radius:var(--radius-lg);background:color-mix(in srgb,var(--surface-2) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:var(--shadow-btn);padding:var(--space-2) var(--space-3);display:flex;flex-direction:column;justify-content:center;gap:var(--space-1)}
#stLine{display:flex;align-items:center;gap:var(--space-2);font-size:14px;line-height:18px;min-width:0}
#stDot{width:8px;height:8px;border-radius:50%;background:var(--ink-muted);flex:none}
#stDot.ok{background:var(--ok)}#stDot.warn{background:var(--amber)}#stDot.bad{background:var(--danger)}
#stText{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink-soft)}
#stMeta{margin-left:auto;color:var(--ink-muted);font-size:13px;white-space:nowrap}
#xpRow{display:flex;align-items:center;gap:var(--space-2);font-size:12px;line-height:16px;color:var(--ink-muted)}
#xpBar{flex:1;height:4px;border-radius:2px;background:var(--surface-3);overflow:hidden}
#xpFill{height:100%;width:0;background:var(--clay);transition:width .32s var(--ease)}
body.work #xpRow{display:none}
#modeSeg{flex:none;margin-top:var(--space-1)}

#right{position:fixed;right:var(--space-2);top:calc(var(--sat) + 76px);display:flex;flex-direction:column;gap:var(--space-2);z-index:5}
#compass svg{transition:transform .1s linear}

#tray{position:fixed;left:var(--space-2);right:var(--space-2);bottom:calc(var(--sab) + var(--space-2));border-radius:var(--radius-lg);background:var(--surface-2);box-shadow:var(--shadow-tray);
  padding:var(--space-2);display:flex;align-items:center;gap:var(--space-2);z-index:6}
#tray .pill{flex:1;justify-content:center}
#recBtn.rec{background:var(--danger-soft);color:var(--danger)}
#recBtn .dot{width:10px;height:10px;border-radius:50%;background:currentColor}
#recBtn.rec .dot{animation:breath 1.6s var(--ease) infinite}
@keyframes breath{50%{opacity:.35;transform:scale(.8)}}
#hud2{position:fixed;left:var(--space-3);top:calc(var(--sat) + 76px);flex-direction:column;align-items:flex-start;display:flex;gap:var(--space-2);z-index:4;pointer-events:none}
.tag{height:var(--control-xs);padding:0 var(--space-2);border-radius:var(--radius-full);background:color-mix(in srgb,var(--surface-1) 85%,transparent);font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:var(--space-1);color:var(--ink-soft)}
.tag.rec{color:var(--danger)}

/* joystick */
#joy{position:fixed;left:var(--space-4);bottom:calc(var(--sab) + 92px);width:132px;height:132px;border-radius:50%;background:color-mix(in srgb,var(--surface-2) 70%,transparent);
  box-shadow:inset 0 0 0 1.5px var(--line);z-index:5;display:none;touch-action:none}
#joy.show{display:block}
#joyK{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;border-radius:50%;background:var(--surface-3);box-shadow:var(--shadow-btn),0 4px 12px #0008;display:grid;place-items:center;color:var(--ink-muted)}
#joyUp{position:fixed;right:var(--space-4);bottom:calc(var(--sab) + 100px);display:none;flex-direction:column;gap:var(--space-2);z-index:5}
#joyUp.show{display:flex}

/* draw bar */
#drawBar{position:fixed;left:var(--space-2);right:var(--space-2);top:calc(var(--sat) + var(--space-2));z-index:7;border-radius:var(--radius-lg);background:var(--surface-2);box-shadow:var(--shadow-tray);
  padding:var(--space-2) var(--space-2) var(--space-2) var(--space-4);display:none;align-items:center;gap:var(--space-2)}
#drawBar.show{display:flex}
#drawBar .t{font-weight:500;font-size:16px;line-height:20px}
#drawBar .s{font-size:13px;line-height:18px;color:var(--ink-muted)}
body.drawing #top{visibility:hidden}

/* sheets */
#scrim{position:fixed;inset:0;background:#0007;opacity:0;pointer-events:none;transition:opacity .2s;z-index:9}
#scrim.show{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;max-height:78vh;background:var(--surface-1);border-radius:var(--radius-lg) var(--radius-lg) 0 0;z-index:10;
  transform:translateY(105%);transition:transform .32s var(--ease);display:flex;flex-direction:column;padding-bottom:var(--sab);box-shadow:0 -8px 24px #0008}
.sheet.show{transform:none}
.sheet .grab{width:36px;height:4px;border-radius:2px;background:var(--surface-3);margin:var(--space-2) auto var(--space-1);flex:none}
.sheet .hd{display:flex;align-items:center;gap:var(--space-2);padding:var(--space-1) var(--space-4) var(--space-2);flex:none}
.sheet .hd h2{margin:0;font:400 22px/28px var(--serif);letter-spacing:-.01em;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sheet .bd{overflow-y:auto;padding:0 var(--space-4) var(--space-4);-webkit-overflow-scrolling:touch;touch-action:pan-y;overscroll-behavior:contain}
.sheet .ft{display:flex;gap:var(--space-2);padding:var(--space-3) var(--space-4);border-top:1px solid var(--line);flex:none}
.sheet .ft .pill{flex:1;justify-content:center}
.tabs{display:flex;gap:var(--space-2);padding:0 var(--space-4) var(--space-3);overflow-x:auto;flex:none;touch-action:pan-x}
.pal{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:var(--space-2)}
.pal button{min-height:84px;border-radius:var(--radius-md);background:var(--surface-2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--space-2);font-size:13px;line-height:16px;font-weight:500;padding:var(--space-2);text-align:center}
.pal button.on{background:var(--clay-soft);box-shadow:inset 0 0 0 2px var(--clay)}
.sw{width:28px;height:28px;border-radius:var(--radius-xs)}
.sw.pt{border-radius:50%}
.sw.ln{height:8px;border-radius:4px;width:36px}
.li{display:flex;align-items:center;gap:var(--space-3);min-height:var(--control-lg);padding:var(--space-2) 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .tt{font-weight:500;font-size:16px;line-height:20px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.li .ss{font-size:13px;line-height:18px;color:var(--ink-muted)}
.li .bc{width:var(--control-md);height:var(--control-md);background:var(--surface-2)}
.empty{padding:var(--space-8) 0;text-align:center;color:var(--ink-muted);font:400 18px/26px var(--serif)}
.ach{display:grid;grid-template-columns:repeat(2,1fr);gap:var(--space-2)}
.ach div{border-radius:var(--radius-md);background:var(--surface-2);padding:var(--space-3);opacity:.45}
.ach div.got{opacity:1;box-shadow:inset 0 0 0 1.5px var(--clay)}
.ach b{display:block;font-size:15px;line-height:20px;font-weight:500}
.ach span{font-size:12px;line-height:16px;color:var(--ink-muted)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--space-2);margin-bottom:var(--space-3)}
.stats div{background:var(--surface-2);border-radius:var(--radius-md);padding:var(--space-3);text-align:center}
.stats b{display:block;font-size:24px;line-height:28px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stats span{font-size:12px;color:var(--ink-muted)}

/* toast */
#toasts{position:fixed;left:0;right:0;top:calc(var(--sat) + 70px);display:flex;flex-direction:column;align-items:center;gap:var(--space-2);z-index:20;pointer-events:none}
.toast{max-width:min(92vw,420px);padding:var(--space-2) var(--space-4);border-radius:var(--radius-full);background:var(--surface-3);box-shadow:0 8px 24px #0009;font-size:15px;line-height:20px;display:flex;gap:var(--space-2);align-items:center;
  animation:tin .2s var(--ease)}
.toast.ok{background:var(--clay-soft);color:var(--clay)}.toast.warn{background:var(--amber-soft);color:var(--amber)}.toast.bad{background:var(--danger-soft);color:var(--danger)}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}}

/* start */
#start{position:fixed;inset:0;z-index:30;background:var(--ground);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:var(--space-6);text-align:center;gap:var(--space-6);transition:opacity .32s}
#start.hide{opacity:0;pointer-events:none}
.mark{width:64px;height:64px;position:relative}
.mark i{position:absolute;inset:18px;border-radius:50%;background:var(--clay)}
.mark b{position:absolute;inset:0;border-radius:50%;box-shadow:inset 0 0 0 2px var(--clay);opacity:.5;animation:ring 2.4s var(--ease) infinite}
@keyframes ring{50%{transform:scale(.86);opacity:.9}}
#start h1{margin:0;font:400 28px/34px var(--serif);letter-spacing:-.015em;color:var(--ink-soft);max-width:320px}
#start p{margin:0;color:var(--ink-muted);font-size:15px;line-height:22px;max-width:340px}
#start .acts{display:flex;flex-direction:column;gap:var(--space-2);width:100%;max-width:320px}
#start .acts .pill{justify-content:center}
#startMsg{min-height:20px;font-size:13px;color:var(--amber)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script type="module">
import * as THREE from 'three';

/* ================= УТИЛІТИ ================= */
const $ = s => document.querySelector(s);
const D2R = Math.PI / 180, R_E = 6378137, HALF = Math.PI * R_E;
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const lerp = (a, b, t) => a + (b - a) * t;
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const angDiff = (a, b) => { let d = (b - a) % 360; if (d > 180) d -= 360; if (d < -180) d += 360; return d; };
const fmtDist = m => m < 1000 ? Math.round(m) + ' м' : (m / 1000).toFixed(m < 10000 ? 2 : 1) + ' км';
const fmtArea = a => a < 10000 ? Math.round(a) + ' м²' : (a / 10000).toFixed(2) + ' га';
const fmtDur = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60); return h ? `${h} год ${m} хв` : `${m} хв ${s % 60} с`; };
const fmtDate = t => new Date(t).toLocaleString('uk-UA', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' });

/* ================= ГЕО ================= */
function merc(lat, lon) { return [R_E * lon * D2R, R_E * Math.log(Math.tan(Math.PI / 4 + lat * D2R / 2))]; }
function unmerc(x, y) { return [(2 * Math.atan(Math.exp(y / R_E)) - Math.PI / 2) / D2R, x / R_E / D2R]; }
const O = { lat: 50.4501, lon: 30.5234, mx: 0, my: 0, k: 1, h0: null };
function setOrigin(lat, lon, h0 = null) { O.lat = lat; O.lon = lon; [O.mx, O.my] = merc(lat, lon); O.k = Math.cos(lat * D2R); O.h0 = h0; }
function toW(lat, lon) { const [mx, my] = merc(lat, lon); return [(mx - O.mx) * O.k, -(my - O.my) * O.k]; }
function toG(x, z) { return unmerc(x / O.k + O.mx, -z / O.k + O.my); }
function hav(a, b) { // [lat,lon]
  const dLa = (b[0] - a[0]) * D2R, dLo = (b[1] - a[1]) * D2R;
  const s = Math.sin(dLa / 2) ** 2 + Math.cos(a[0] * D2R) * Math.cos(b[0] * D2R) * Math.sin(dLo / 2) ** 2;
  return 2 * R_E * Math.asin(Math.sqrt(s));
}
const TZ = 15, TSZ = 2 * HALF / 2 ** TZ;           // розмір тайла в меркаторних метрах
function tileOfW(x, z) { const mx = x / O.k + O.mx, my = -z / O.k + O.my; return [Math.floor((mx + HALF) / TSZ), Math.floor((HALF - my) / TSZ)]; }
function tileBox(tx, ty) { // світові координати
  const mxW = -HALF + tx * TSZ, myN = HALF - ty * TSZ, s = TSZ * O.k;
  return { x0: (mxW - O.mx) * O.k, z0: -(myN - O.my) * O.k, s };
}
function polyArea(p) { let a = 0; for (let i = 0, j = p.length - 1; i < p.length; j = i++) a += (p[j][0] + p[i][0]) * (p[j][1] - p[i][1]); return Math.abs(a / 2); }
function polyLen(p) { let d = 0; for (let i = 1; i < p.length; i++) d += Math.hypot(p[i][0] - p[i - 1][0], p[i][1] - p[i - 1][1]); return d; }
function inPoly(x, z, p) { let c = false; for (let i = 0, j = p.length - 1; i < p.length; j = i++) { const [xi, zi] = p[i], [xj, zj] = p[j]; if ((zi > z) !== (zj > z) && x < (xj - xi) * (z - zi) / (zj - zi) + xi) c = !c; } return c; }
function segDist(x, z, a, b) { const dx = b[0] - a[0], dz = b[1] - a[1], l = dx * dx + dz * dz; let t = l ? ((x - a[0]) * dx + (z - a[1]) * dz) / l : 0; t = clamp(t, 0, 1); return Math.hypot(x - a[0] - t * dx, z - a[1] - t * dz); }
function lineDist(x, z, p) { let m = Infinity; for (let i = 1; i < p.length; i++) m = Math.min(m, segDist(x, z, p[i - 1], p[i])); return m; }
function simplify(pts, eps) { // Douglas-Peucker на [x,z,...]
  if (pts.length < 3) return pts.slice();
  const keep = new Uint8Array(pts.length); keep[0] = keep[pts.length - 1] = 1;
  const st = [[0, pts.length - 1]];
  while (st.length) {
    const [a, b] = st.pop(); let md = 0, mi = -1;
    for (let i = a + 1; i < b; i++) { const d = segDist(pts[i][0], pts[i][1], pts[a], pts[b]); if (d > md) { md = d; mi = i; } }
    if (md > eps) { keep[mi] = 1; st.push([a, mi], [mi, b]); }
  }
  return pts.filter((_, i) => keep[i]);
}
function bboxOf(w) { let a = Infinity, b = Infinity, c = -Infinity, d = -Infinity; for (const [x, z] of w) { a = Math.min(a, x); b = Math.min(b, z); c = Math.max(c, x); d = Math.max(d, z); } return [a, b, c, d]; }

/* ================= СТАТУС (суржиком) ================= */
const SAY = {
  boot: ['прогріваю двигун…', 'розкочегарюю рельєф, не смикай', 'запрягаю коні в шейдери'],
  dem: ['гружу рельєф, шо аж пищить…', 'тягну горби з Амазону, тримайся', 'висоти підвантажую, курни поки'],
  demFail: ['рельєф не приїхав, трясця — малюю плаский', 'DEM-сервер послав нас лісом, буде рівнина'],
  ov: ['калька підтягується, не гальмуй', 'супутник шось тупить, чекаєм'],
  gpsWait: ['GPS ловить як бабця вайфай…', 'шукаю супутники, вони шось сором\'язливі'],
  gpsOk: ['GPS на місці, їдемо', 'бачу тебе, красава', 'координати є — погнали'],
  gpsBad: ['точність хрінова, ±{a} м — не віримо', 'GPS бреше на {a} м, ігнорю'],
  gpsDenied: ['геопозицію не дали — катаємось вручну', 'без GPS, ну шо ж, джойстик в зуби'],
  osm: ['тягну OSM, не гальмуй…', 'смикаю Overpass, він тугенький'],
  osmFail: ['Overpass ліг, спробуй пізніше', 'OSM не віддав нічого, жмот'],
  saved: ['зберіг, не переживай', 'записав у скриню'],
  rec: ['пишу трек, жми газ', 'запис іде, не збивайся з курсу'],
  idle: ['все тіпо-топ', 'тиша, спокій, рельєф', 'мандруєм потихеньку'],
};
const pick = (k, v = {}) => { const a = SAY[k]; return a[Math.floor(Math.random() * a.length)].replace(/\{(\w+)\}/g, (_, n) => v[n]); };
let stTimer = 0;
function status(k, tone = '', v, hold = 0) {
  $('#stText').textContent = SAY[k] ? pick(k, v) : k;
  $('#stDot').className = tone;
  clearTimeout(stTimer);
  if (hold) stTimer = setTimeout(() => status(S.recording ? 'rec' : 'idle', S.gpsOk ? 'ok' : ''), hold);
}
function toast(msg, tone = '') {
  const t = document.createElement('div'); t.className = 'toast ' + tone; t.textContent = msg;
  $('#toasts').appendChild(t); setTimeout(() => t.remove(), 3200);
}

/* ================= СХОВИЩЕ (IndexedDB) ================= */
const DB = {
  db: null,
  open() {
    return new Promise((res) => {
      let rq; try { rq = indexedDB.open('slid', 1); } catch (e) { return res(null); }
      rq.onupgradeneeded = () => { const d = rq.result; d.createObjectStore('kv'); d.createObjectStore('obj', { keyPath: 'id' }); d.createObjectStore('trk', { keyPath: 'id' }); d.createObjectStore('fog'); };
      rq.onsuccess = () => { this.db = rq.result; res(this.db); };
      rq.onerror = () => res(null);
    });
  },
  tx(st, mode, fn) {
    return new Promise((res) => {
      if (!this.db) return res(null);
      try { const t = this.db.transaction(st, mode), s = t.objectStore(st), r = fn(s); t.oncomplete = () => res(r && r.result !== undefined ? r.result : r); t.onerror = () => res(null); } catch (e) { res(null); }
    });
  },
  get(st, k) { return this.tx(st, 'readonly', s => s.get(k)); },
  put(st, v, k) { return this.tx(st, 'readwrite', s => k === undefined ? s.put(v) : s.put(v, k)); },
  del(st, k) { return this.tx(st, 'readwrite', s => s.delete(k)); },
  all(st) { return this.tx(st, 'readonly', s => s.getAll()); },
  keys(st) { return this.tx(st, 'readonly', s => s.getAllKeys()); },
  clear(st) { return this.tx(st, 'readwrite', s => s.clear()); },
};

/* ================= СТАН ================= */
const S = {
  mode: 'game',           // game | work
  ctl: 'gps',             // gps | manual
  avatarPref: 'auto',     // auto | walk | bike | car | drone
  avatar: 'walk',
  cam: 'follow',          // follow | free | top
  overlay: 'dark',        // off | dark | light | sat
  ovA: 0.55,
  exag: 1.5,
  radius: 2,
  fogR: 45,
  cheat: false,
  showTracks: true,
  recording: false,
  gpsOk: false, gps: null, gpsAcc: 999, gpsSpeed: 0, gpsHead: null, compass: null,
  pos: new THREE.Vector3(), head: 0, speed: 0, alt: 0,     // аватар у світі
  xp: 0, ach: {}, stats: { gpsDist: 0, newDist: 0, objs: 0, tiles: 0, roads: 0, droneT: 0 },
};
const SETTINGS_KEYS = ['mode', 'avatarPref', 'overlay', 'ovA', 'exag', 'radius', 'fogR', 'cheat', 'showTracks'];
let saveMetaT = 0;
function saveMeta() {
  clearTimeout(saveMetaT);
  saveMetaT = setTimeout(() => {
    const set = {}; SETTINGS_KEYS.forEach(k => set[k] = S[k]);
    DB.put('kv', { origin: { lat: O.lat, lon: O.lon, h0: O.h0 }, set, xp: S.xp, ach: S.ach, stats: S.stats, last: S.lastGeo || null }, 'meta');
  }, 400);
}

/* ================= РЕНДЕР ================= */
const canvas = $('#gl');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.setSize(innerWidth, innerHeight, false);
const SKY = new THREE.Color('#1c1b19');
const scene = new THREE.Scene();
scene.background = SKY;
scene.fog = new THREE.Fog(SKY, 900, 3200);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.5, 9000);
scene.add(new THREE.HemisphereLight(0xfff1dc, 0x2a2520, 1.6));
const sun = new THREE.DirectionalLight(0xffffff, 1.6); sun.position.set(-0.45, 1, 0.35); scene.add(sun);
const SUN_DIR = sun.position.clone().normalize();
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight, false); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

const terrainGroup = new THREE.Group(); scene.add(terrainGroup);
const TU = { // спільні уніформи
  uOvA: { value: S.ovA }, uFogOn: { value: 1 }, uExag: { value: S.exag }, uSun: { value: SUN_DIR },
  uFogNear: { value: 900 }, uFogFar: { value: 3200 }, uSky: { value: new THREE.Vector3(0.11, 0.106, 0.098) }, uTime: { value: 0 },
};
const BLANK = new THREE.DataTexture(new Uint8Array([0, 0, 0, 0]), 1, 1); BLANK.needsUpdate = true;
const VS = `
varying vec2 vUv; varying vec3 vN; varying float vY; varying float vD;
void main(){ vUv=uv; vN=normal; vY=position.y; vec4 mv=modelViewMatrix*vec4(position,1.); vD=length(mv.xyz); gl_Position=projectionMatrix*mv; }`;
const FS = `
uniform sampler2D uOv,uPaint,uFogT; uniform float uOvA,uHasOv,uFogOn,uExag,uFogNear,uFogFar,uTime; uniform vec3 uSun,uSky;
varying vec2 vUv; varying vec3 vN; varying float vY; varying float vD;
void main(){
  vec3 n=normalize(vN); float slope=1.-n.y; float h=vY/uExag;
  vec3 base=mix(vec3(.23,.245,.2),vec3(.33,.31,.255),clamp(h/60.+.5,0.,1.));
  base=mix(base,vec3(.34,.32,.29),smoothstep(.12,.45,slope));
  float f5=h/5.; float fw=max(fwidth(f5),1e-4); float d=min(fract(f5),1.-fract(f5))/fw;
  base+=(1.-clamp(d,0.,1.))*.045;
  float f25=h/25.; float fw2=max(fwidth(f25),1e-4); float d2=min(fract(f25),1.-fract(f25))/fw2;
  base+=(1.-clamp(d2*.7,0.,1.))*.06;
  float dif=clamp(dot(n,uSun),0.,1.); float L=.3+.95*dif;
  vec3 col=base*L;
  vec4 ov=texture2D(uOv,vUv); col=mix(col,ov.rgb*(.7+.42*dif),uOvA*uHasOv*ov.a);
  vec4 p=texture2D(uPaint,vUv); col=mix(col,p.rgb*(.62+.5*dif),p.a);
  if(uFogOn>.5){
    float fg=texture2D(uFogT,vUv).r;
    float hatch=step(.5,fract((gl_FragCoord.x+gl_FragCoord.y)/9.))*.018;
    vec3 dark=col*.2+vec3(.035,.033,.03)+hatch;
    col=mix(dark,col,smoothstep(.08,.85,fg));
  }
  float fogF=smoothstep(uFogNear,uFogFar,vD);
  gl_FragColor=vec4(mix(col,uSky,fogF),1.);
}`;

/* ================= ТАЙЛИ ================= */
const tiles = new Map();
const N = 65;
const OVS = {
  dark: { name: 'Схема', url: (z, x, y) => `https://${'abcd'[(x + y) & 3]}.basemaps.cartocdn.com/dark_all/${z}/${x}/${y}.png` },
  light: { name: 'Світла', url: (z, x, y) => `https://${'abcd'[(x + y) & 3]}.basemaps.cartocdn.com/rastertiles/voyager/${z}/${x}/${y}.png` },
  sat: { name: 'Супутник', url: (z, x, y) => `https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/${z}/${y}/${x}` },
};
let ovGen = 0;

// черга завантажень з пріоритетом за відстанню
const Q = { run: 0, max: 6, list: [] };
function enqueue(tile, fn) { Q.list.push({ tile, fn }); pump(); }
function pump() {
  if (Q.run >= Q.max || !Q.list.length) return;
  const [fx, fy] = tileOfW(focusPos().x, focusPos().z);
  Q.list = Q.list.filter(j => !j.tile.dead);
  Q.list.sort((a, b) => (Math.abs(a.tile.tx - fx) + Math.abs(a.tile.ty - fy)) - (Math.abs(b.tile.tx - fx) + Math.abs(b.tile.ty - fy)));
  while (Q.run < Q.max && Q.list.length) {
    const j = Q.list.shift(); Q.run++;
    Promise.resolve().then(j.fn).catch(() => { }).finally(() => { Q.run--; pump(); });
  }
}
function loadImg(url) {
  return new Promise((res, rej) => { const im = new Image(); im.crossOrigin = 'anonymous'; im.onload = () => res(im); im.onerror = rej; im.src = url; setTimeout(() => rej('timeout'), 15000); });
}

class Tile {
  constructor(tx, ty) {
    this.tx = tx; this.ty = ty; this.key = tx + '_' + ty;
    Object.assign(this, tileBox(tx, ty));
    this.dem = null; this.demOk = false; this.G = new Float32Array(N * N);
    const g = new THREE.BufferGeometry();
    const pos = new Float32Array(N * N * 3), uv = new Float32Array(N * N * 2), idx = [];
    for (let j = 0; j < N; j++) for (let i = 0; i < N; i++) {
      const k = j * N + i; pos[k * 3] = this.x0 + i / (N - 1) * this.s; pos[k * 3 + 2] = this.z0 + j / (N - 1) * this.s;
      uv[k * 2] = i / (N - 1); uv[k * 2 + 1] = j / (N - 1);
      if (i < N - 1 && j < N - 1) idx.push(k, k + N, k + 1, k + 1, k + N, k + N + 1);
    }
    g.setAttribute('position', new THREE.BufferAttribute(pos, 3)); g.setAttribute('uv', new THREE.BufferAttribute(uv, 2)); g.setIndex(idx);
    g.computeVertexNormals(); g.computeBoundingSphere();
    this.geo = g;
    // шари
    this.setRes(512, true);
    this.fc = document.createElement('canvas'); this.fc.width = this.fc.height = 128; this.fctx = this.fc.getContext('2d', { willReadFrequently: true });
    this.fctx.fillStyle = '#000'; this.fctx.fillRect(0, 0, 128, 128);
    this.ftex = new THREE.CanvasTexture(this.fc); this.ftex.flipY = false;
    this.hasFog = false; this.fogDirty = false;
    this.mat = new THREE.ShaderMaterial({
      vertexShader: VS, fragmentShader: FS,
      uniforms: { ...TU, uOv: { value: BLANK }, uHasOv: { value: 0 }, uPaint: { value: this.ptex }, uFogT: { value: this.ftex } },
    });
    this.mesh = new THREE.Mesh(g, this.mat); this.mesh.userData.tile = this;
    terrainGroup.add(this.mesh);
    this.paintDirty = true;
    enqueue(this, () => this.loadDem());
    this.loadOv();
    DB.get('fog', this.key).then(async b => {
      if (!b || tiles.get(this.key) !== this) return;
      try { const bm = await createImageBitmap(b); this.fctx.globalCompositeOperation = 'lighten'; this.fctx.drawImage(bm, 0, 0); this.fctx.globalCompositeOperation = 'source-over'; this.ftex.needsUpdate = true; this.hasFog = true; } catch (e) { }
    });
  }
  setRes(r, init) {
    if (this.pc && this.pc.width === r) return;

  if (t.building) { const lv = parseInt(t['building:levels']) || ({ apartments: 9, residential: 5, commercial: 3, retail: 2, office: 4, industrial: 2, school: 3, hospital: 4, church: 3 }[t.building]) || 1; return { type: 'building', props: { floors: clamp(lv, 1, 60) } }; }
  if (t.highway) {
    if (/^(footway|path|track|cycleway|steps|bridleway|pedestrian)$/.test(t.highway)) return { type: 'path', props: { w: t.highway === 'track' ? 3 : 2 } };
    const w = { motorway: 16, trunk: 14, primary: 11, secondary: 9, tertiary: 8, residential: 6, unclassified: 6, living_street: 5, service: 4 }[t.highway.replace('_link', '')];
    return w ? { type: 'road', props: { w } } : null;
  }
  if (t.natural === 'water') return { type: 'water' };
  if (t.waterway) return { type: 'river', props: { w: { river: 12, canal: 6, stream: 3 }[t.waterway] } };
  if (t.landuse === 'forest' || t.natural === 'wood') return { type: 'forest' };
  if (t.landuse === 'farmland' || t.landuse === 'orchard') return { type: 'field' };
  if (t.landuse || t.leisure || t.natural === 'scrub') return { type: 'grass' };
  if (t.amenity === 'parking') return { type: 'parking' };
  if (t.railway === 'rail') return { type: 'rail' };
  if (t.barrier) return { type: 'fence' };
  if (t.power === 'line') return { type: 'power' };
  if (t.natural === 'tree') return { type: 'tree', props: { scale: .9 } };
  return null;
}
DB.putMany = function (st, arr) { return this.tx(st, 'readwrite', s => { arr.forEach(v => s.put(v)); return null; }); };
async function confirmDrafts(all) {
  const ds = [...World.objs.values()].filter(o => o.draft);
  if (all) { ds.forEach(o => { o.draft = false; World.build(o); }); await DB.putMany('obj', ds.map(strip)); markPaintAll(); Game.add(ds.length * 3); toast(`Підтверджено ${ds.length}`, 'ok'); Game.check(); }
  else { ds.forEach(o => { if (o._g) { World.g.remove(o._g); disposeGroup(o._g); } World.objs.delete(o.id); DB.del('obj', o.id); }); markPaintAll(); toast(`Прибрано ${ds.length} чернеток`); }
}

const Game = {
  acc: 0,
  add(n, why) {
    if (!n) return; const l0 = lvlOf(S.xp); S.xp += Math.round(n); saveMeta();
    if (S.mode === 'game') { if (why) toast(`+${Math.round(n)} XP · ${why}`, 'ok'); const l1 = lvlOf(S.xp); if (l1 > l0) toast(`Рівень ${l1} — ${LV_T[Math.min(l1 - 1, LV_T.length - 1)]}`, 'ok'); }
    UI.xp();
  },
  newGround(d) { S.stats.newDist += d; this.acc += d; if (this.acc >= 10) { const n = Math.floor(this.acc / 10); this.acc -= n * 10; this.add(n); } },
  event(e, o) {
    if (e === 'obj') { S.stats.objs++; const k = TYPES[o.type].k; this.add(k === 'pt' ? 10 : k === 'ar' ? 15 : 12, TYPES[o.type].n); }
    if (e === 'tile') { S.stats.tiles++; this.add(25, 'новий квадрат'); }
    if (e === 'track') { const h = new Date(o.start).getHours(); if (h < 5) S.stats.night = 1; this.add(20 + Math.floor(o.dist / 100), 'трек'); }

    for (const [id, n, d, f] of ACH) {

    }
  },
};

      b.querySelector('#cT').onchange = e => { o.type = e.target.value; if (TYPES[o.type].floors && !o.props.floors) o.props.floors = TYPES[o.type].floors; upd(true); this.redraw(); };
      b.querySelectorAll('[data-st]').forEach(x => x.onclick = () => { o.props.floors = clamp((o.props.floors || T.floors) + +x.dataset.st, 1, 60); b.querySelector('#cF').textContent = o.props.floors; upd(true); });
      const rg = (id, key, fmt) => { const el = b.querySelector(id); if (el) el.oninput = e => { o.props[key] = +e.target.value; b.querySelector(id + 'v').textContent = fmt(+e.target.value); upd(true); }; };
      rg('#cW', 'w', v => v + ' м'); rg('#cR', 'rot', v => v + '°'); rg('#cS', 'scale', v => v.toFixed(1) + '×');
      const h = b.querySelector('#cHere'); if (h) h.onclick = () => { o.pts = [toG(S.pos.x, S.pos.z).map(v => +v.toFixed(7))]; upd(true); toast('Перенесено'); };
      f.hidden = false;
      f.innerHTML = `<button class="pill danger" id="cDel">${ico('trash')}Видалити</button>${o.draft ? `<button class="pill primary" id="cOk">${ico('check')}Підтвердити</button>` : `<button class="pill primary" id="cDone">${ico('check')}Готово</button>`}`;
      let armed = false;
      f.querySelector('#cDel').onclick = e => { if (!armed) { armed = true; e.currentTarget.textContent = 'Точно видалити?'; setTimeout(() => armed = false, 2500); return; } World.remove(o.id); deselect(); this.closeSheet(); toast('Видалено'); };
      const ok = f.querySelector('#cOk'); if (ok) ok.onclick = () => { o.draft = false; World.update(o); Game.add(3, 'підтверджено'); this.closeSheet(); };
      const dn = f.querySelector('#cDone'); if (dn) dn.onclick = () => { World.update(o); this.closeSheet(); };
    }, 'card');
  },
  /* ---- журнал ---- */
  journal(tab) {
    this.openSheet('Журнал', [['trk', 'Треки'], ['obj', 'Обʼєкти'], ['ach', 'Прогрес'], ['world', 'Світ']], tab || this.lastJr || 'trk', (tab, b) => {
      this.lastJr = tab;
      if (tab === 'trk') {
        const trs = [...Tracks.list.values()].sort((a, b) => b.start - a.start);
        if (!trs.length) { b.innerHTML = `<div class="empty">Тут житимуть твої маршрути.</div>`; return; }
        b.innerHTML = trs.map(t => `<div class="li" data-id="${t.id}"><button class="bc" data-act="eye" style="${t.visible ? '' : 'opacity:.4'}">${ico('eye')}</button><div class="grow" data-act="fly" style="cursor:pointer"><div class="tt">${esc(t.name)}</div><div class="ss num">${fmtDist(t.dist)} · ${fmtDur((t.end - t.start) / 1000)} · ${t.src === 'gps' ? 'GPS' : 'віртуальний'}</div></div><button class="bc" data-act="gpx">${ico('dl')}</button><button class="bc" data-act="del">${ico('trash')}</button></div>`).join('');
        b.onclick = e => {
          const a = e.target.closest('[data-act]'); if (!a) return; const id = a.closest('[data-id]').dataset.id, t = Tracks.list.get(id); if (!t) return;
          if (a.dataset.act === 'eye') { t.visible = !t.visible; DB.put('trk', strip(t)); markPaint(t._bb); this.redraw(); }
          if (a.dataset.act === 'fly') { const c = [(t._bb[0] + t._bb[2]) / 2, (t._bb[1] + t._bb[3]) / 2]; flyTo(c[0], c[1], clamp(Math.max(t._bb[2] - t._bb[0], t._bb[3] - t._bb[1]) * 1.3, 150, 4000)); this.closeSheet(); }
          if (a.dataset.act === 'gpx') download(Tracks.gpx([t]), safeName(t.name) + '.gpx', 'application/gpx+xml');
          if (a.dataset.act === 'del') { if (a.dataset.armed) { Tracks.remove(id); this.redraw(); } else { a.dataset.armed = 1; a.style.color = 'var(--danger)'; setTimeout(() => { delete a.dataset.armed; a.style.color = ''; }, 2500); } }
        };
      } else if (tab === 'obj') {
        const os = [...World.objs.values()];
        if (!os.length) { b.innerHTML = `<div class="empty">Світ поки порожній.<br>Тисни «Будувати».</div>`; return; }
        const cnt = {}; os.forEach(o => cnt[o.type] = (cnt[o.type] || 0) + 1);
        const f = this.objF || '';
        b.innerHTML = `<div class="row" style="flex-wrap:wrap;gap:6px;margin-bottom:8px"><button class="chip ${!f ? 'on' : ''}" data-f="">Усі ${os.length}</button>${Object.entries(cnt).map(([k, n]) => `<button class="chip ${f === k ? 'on' : ''}" data-f="${k}">${TYPES[k].n} ${n}</button>`).join('')}</div>` +
          os.filter(o => !f || o.type === f).sort((a, b) => b.created - a.created).slice(0, 150).map(o => `<div class="li" data-o="${o.id}" style="cursor:pointer">${swatch(o.type)}<div class="grow"><div class="tt">${esc(o.name)}${o.draft ? ' <span class="muted cap">· чернетка</span>' : ''}</div><div class="ss">${TYPES[o.type].n}${o.note ? ' · ' + esc(o.note.slice(0, 40)) : ''}</div></div></div>`).join('');
        b.onclick = e => {
          const ff = e.target.closest('[data-f]'); if (ff) { this.objF = ff.dataset.f; this.redraw(); return; }
          const x = e.target.closest('[data-o]'); if (!x) return; const o = World.objs.get(x.dataset.o); const c = centroid(o._w); flyTo(c[0], c[1], 220); setTimeout(() => select(o.id), 50);
        };
      } else if (tab === 'ach') {
        const l = lvlOf(S.xp);
        b.innerHTML = `<div class="row" style="margin-bottom:12px"><div class="grow"><div style="font:400 22px/28px var(--serif)">${LV_T[Math.min(l - 1, LV_T.length - 1)]}</div><div class="cap muted num">рівень ${l} · ${S.xp} XP · до наступного ${xpFor(l + 1) - S.xp}</div></div></div>
          <div class="stats"><div><b>${(S.stats.gpsDist / 1000).toFixed(1)}</b><span>км по GPS</span></div><div><b>${S.stats.tiles}</b><span>квадратів</span></div><div><b>${[...World.objs.values()].filter(o => !o.draft).length}</b><span>обʼєктів</span></div></div>
          <div class="ach">${ACH.map(([id, n, d]) => `<div class="${S.ach[id] ? 'got' : ''}"><b>${S.ach[id] ? '✓ ' : ''}${n}</b><span>${d}</span></div>`).join('')}</div>
          ${S.mode === 'work' ? '<p class="cap muted">Зараз режим РОБОТА — XP рахується тихо.</p>' : ''}`;
      } else {
        b.innerHTML = `
          <div class="field"><label>Туман війни · радіус відкриття</label><div class="seg wide" id="wFog">${[30, 45, 80].map(v => `<button data-v="${v}" class="${S.fogR === v ? 'on' : ''}">${v} м</button>`).join('')}</div></div>
          <div class="field"><label>Ручна розвідка (чіт)</label><div class="seg wide" id="wCh"><button data-v="0" class="${!S.cheat ? 'on' : ''}">Лише GPS</button><button data-v="1" class="${S.cheat ? 'on' : ''}">І джойстик теж</button></div></div>
          <div class="hr"></div>
          <div class="ovl" style="margin-bottom:8px">Дані</div>
          <div class="row" style="flex-wrap:wrap"><button class="pill" id="wExp">${ico('dl')}Світ JSON</button><button class="pill" id="wGpx">${ico('dl')}Усі треки GPX</button><button class="pill" id="wImp">${ico('ul')}Імпорт JSON/GPX</button></div>
          <input type="file" id="wFile" accept=".json,.gpx,application/json,application/gpx+xml" hidden>
          <p class="cap muted">Усе зберігається лише в цьому браузері. Роби експорт, щоб не втратити світ.</p>
          <div class="hr"></div>
          <div class="ovl" style="margin-bottom:8px">Центр світу</div>
          <p class="cap muted num" style="margin:0 0 8px">${O.lat.toFixed(5)}, ${O.lon.toFixed(5)} · база ${O.h0 != null ? Math.round(O.h0) + ' м' : '—'}</p>
          <button class="pill danger" id="wReset">${ico('trash')}Стерти весь світ</button>`;
        const seg = (id, fn) => b.querySelector(id).onclick = e => { const x = e.target.closest('[data-v]'); if (!x) return; fn(x.dataset.v); saveMeta(); this.redraw(); };
        seg('#wFog', v => S.fogR = +v); seg('#wCh', v => S.cheat = v === '1');
        b.querySelector('#wExp').onclick = exportWorld;
        b.querySelector('#wGpx').onclick = () => { const l = [...Tracks.list.values()]; if (!l.length) return toast('Нема треків', 'warn'); download(Tracks.gpx(l), 'slid-tracks.gpx', 'application/gpx+xml'); };
        b.querySelector('#wImp').onclick = () => b.querySelector('#wFile').click();
        b.querySelector('#wFile').onchange = e => { const f = e.target.files[0]; if (f) importFile(f).then(() => this.redraw()); };
        let n = 0; b.querySelector('#wReset').onclick = async e => { if (++n < 3) { e.currentTarget.textContent = n === 1 ? 'Ще раз — і все зникне' : 'Останній шанс'; return; } await resetWorld(); };
      }
    });
  },
};

/* ================= ДАНІ ================= */
function safeName(s) { return String(s).replace(/[^\p{L}\p{N}_-]+/gu, '_').slice(0, 50); }
function download(text, name, type) {
  const blob = text instanceof Blob ? text : new Blob([text], { type }); const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 2000);
}
const blobToURL = b => new Promise(r => { const f = new FileReader(); f.onload = () => r(f.result); f.readAsDataURL(b); });
async function exportWorld() {
  status('пакую світ у валізу…', 'warn');
  tiles.forEach(t => t.fogDirty && saveFog(t, true));
  await new Promise(r => setTimeout(r, 300));
  const fog = {}; const keys = await DB.keys('fog') || [];
  for (const k of keys) { const b = await DB.get('fog', k); if (b) fog[k] = await blobToURL(b); }
  const set = {}; SETTINGS_KEYS.forEach(k => set[k] = S[k]);
  const data = { app: 'slid', v: 1, at: new Date().toISOString(), origin: { lat: O.lat, lon: O.lon, h0: O.h0 }, xp: S.xp, ach: S.ach, stats: S.stats, set, objects: [...World.objs.values()].map(strip), tracks: [...Tracks.list.values()].map(strip), fog };
  download(JSON.stringify(data), `slid-world-${new Date().toISOString().slice(0, 10)}.json`, 'application/json');
  status('saved', 'ok', null, 3000);
}
async function importFile(f) {
  const txt = await f.text();
  try {
    if (/\.gpx$/i.test(f.name) || txt.trim().startsWith('<')) {
      const doc = new DOMParser().parseFromString(txt, 'application/xml'); let n = 0;
      doc.querySelectorAll('trk, rte').forEach(trk => {
        const pts = [...trk.querySelectorAll('trkpt, rtept')].map(p => [+(+p.getAttribute('lat')).toFixed(7), +(+p.getAttribute('lon')).toFixed(7), p.querySelector('ele') ? Math.round(+p.querySelector('ele').textContent) : null, p.querySelector('time') ? Date.parse(p.querySelector('time').textContent) || Date.now() : Date.now(), 0]);
        if (pts.length < 2) return;
        let dist = 0; for (let i = 1; i < pts.length; i++) dist += hav(pts[i - 1], pts[i]);
        const t = { id: uid(), name: trk.querySelector('name')?.textContent || 'Імпорт GPX', src: 'gps', start: pts[0][3], end: pts[pts.length - 1][3], pts, dist, visible: true };
        Tracks.prep(t); Tracks.list.set(t.id, t); DB.put('trk', strip(t)); markPaint(t._bb); n++;
      });
      toast(n ? `Імпортовано треків: ${n}` : 'У GPX нема треків', n ? 'ok' : 'warn');
      return;
    }
    const d = JSON.parse(txt); if (d.app !== 'slid') throw 0;
    const objs = (d.objects || []).filter(o => o.id && o.type && TYPES[o.type] && Array.isArray(o.pts));
    objs.forEach(o => { if (World.objs.has(o.id)) World.remove(o.id); World.add(o, false); });
    await DB.putMany('obj', objs);
    (d.tracks || []).forEach(t => { if (!t.id || !Array.isArray(t.pts)) return; Tracks.prep(t); Tracks.list.set(t.id, t); DB.put('trk', t); markPaint(t._bb); });
    for (const [k, url] of Object.entries(d.fog || {})) {
      try {
        const nb = await (await fetch(url)).blob(), old = await DB.get('fog', k), c = document.createElement('canvas'); c.width = c.height = 128; const x = c.getContext('2d');
        x.fillStyle = '#000'; x.fillRect(0, 0, 128, 128); x.globalCompositeOperation = 'lighten';
        if (old) x.drawImage(await createImageBitmap(old), 0, 0); x.drawImage(await createImageBitmap(nb), 0, 0);
        const merged = await new Promise(r => c.toBlob(r)); await DB.put('fog', merged, k);
        const t = tiles.get(k); if (t) { t.fctx.globalCompositeOperation = 'lighten'; t.fctx.drawImage(c, 0, 0); t.fctx.globalCompositeOperation = 'source-over'; t.ftex.needsUpdate = true; t.hasFog = true; }
      } catch (e) { }
    }
    if (d.xp > S.xp) { S.xp = d.xp; S.ach = { ...d.ach, ...S.ach }; S.stats = { ...S.stats, ...d.stats }; }
    saveMeta(); UI.xp(); markPaintAll();
    toast(`Імпорт: ${objs.length} обʼєктів, ${(d.tracks || []).length} треків`, 'ok');
  } catch (e) { toast('Файл не схожий на світ СЛІДу', 'bad'); }
}
async function resetWorld() {
  await Promise.all(['kv', 'obj', 'trk', 'fog'].map(s => DB.clear(s)));
  location.reload();
}

/* ================= СТАРТ ================= */
async function init() {
  status('boot');
  await DB.open();
  const meta = await DB.get('kv', 'meta');
  if (meta && meta.origin) {
    setOrigin(meta.origin.lat, meta.origin.lon, meta.origin.h0 ?? null); S.originSet = true;
    Object.assign(S, meta.set || {}); S.xp = meta.xp || 0; S.ach = meta.ach || {}; S.stats = { ...S.stats, ...(meta.stats || {}) }; S.lastGeo = meta.last;
  } else setOrigin(O.lat, O.lon, null);
  TU.uOvA.value = S.ovA; TU.uExag.value = S.exag;
  if (S.lastGeo) { const [x, z] = toW(S.lastGeo[0], S.lastGeo[1]); S.pos.set(x, 0, z); Cam.target.set(x, 0, z); }
  World.init(); buildAvatars(); UI.init();
  Live.trk = new LiveLine('#93c48b'); Live.draw = new LiveLine('#93c48b', 16);
  if (S.avatarPref !== 'auto') setAvatar(S.avatarPref);
  (await DB.all('obj') || []).forEach(o => { if (TYPES[o.type]) World.add(o, false); });
  (await DB.all('trk') || []).forEach(t => { if (t.pts && t.pts.length > 1) { Tracks.prep(t); Tracks.list.set(t.id, t); } });
  updateTiles(true);
  requestAnimationFrame(frame);
  status('dem', '', null, 3000);
  const hide = () => $('#start').classList.add('hide');
  $('#goGps').onclick = async () => { await askSensors(); startGPS(); UI.setCtl('gps'); hide(); };
  $('#goDemo').onclick = async () => { await askSensors(); UI.setCtl('manual'); setCamMode('follow'); hide(); status(S.originSet ? 'idle' : 'gpsDenied', '', null, 4000); };
  if (!meta) $('#goDemo').textContent = 'Без GPS — почати з Києва';
}
function onTileReady(t) { World.reground(t); t.paintDirty = true; }
addEventListener('visibilitychange', () => { if (document.hidden) { tiles.forEach(t => t.fogDirty && saveFog(t, true)); if (Tracks.cur) DB.put('trk', strip(Tracks.cur)); } });
init();
window.__slid = { S, O, World, Tracks, tiles, Cam, Draw, Game, UI, heightAt, toW, toG };

</script>
